<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BELAJAR MEMBACA - Login</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="assets/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/style.css" rel="stylesheet">
</head>

<body>
    <main>
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100 py-4">
                <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start w-100 mb-4">
                    <div class="gambar-wrapper" onclick="toggleMute()" title="Suara">
                        <img src="assets/icon/high-volume.png" alt="Volume" class="gambar-shadow" id="volumeImage">
                    </div>
                </div>

                <div class="text-center mb-4">
                    <img src="assets/img/title-membaca.png" class="gambar-title" alt="Belajar Membaca">
                    <h2 class="mt-3" style="color:var(--c-soft);">BERSAMA KAMI, ANAK MAKIN PINTAR MEMBACA</h2>
                </div>

                <div class="col-11 col-sm-8 col-md-6 col-lg-4">
                    <div class="card-login p-4">
                        <h2 class="text-center mb-4">
                            <i class="bi bi-mortarboard-fill me-2"></i>Login
                        </h2>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="name" class="form-label"><i class="bi bi-person-fill me-1"></i>Nama</label>
                                <input type="text" class="form-control" id="name" name="name" placeholder="Nama lengkap" required>
                            </div>
                            <div class="mb-4">
                                <label for="school" class="form-label"><i class="bi bi-building-fill me-1"></i>Sekolah</label>
                                <input type="text" class="form-control" id="school" name="school" placeholder="Nama sekolah" required>
                            </div>
                            <button type="submit" class="btn-primary btn w-100">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Login
                            </button>
                        </form>
                        <p id="error-message" class="text-center text-danger fw-bold mt-3 mb-0 d-none">
                            Mohon masukkan nama dan sekolah!
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <audio id="audioPlayer" autoplay loop>
        <source src="assets/music/bg.wav" type="audio/mp3">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <script src="assets/login.js"></script>
    <script src="assets/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
