<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BELAJAR MEMBACA - Mengenal Kata</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="assets/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/style.css" rel="stylesheet">

    <style>
        .flash-card {
            width: min(340px, 82vw);
            aspect-ratio: 4 / 5;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            border-radius: 38px;
            background: linear-gradient(145deg, rgba(217, 119, 6, 0.4), rgba(245, 158, 11, 0.32), rgba(8, 51, 68, 0.6));
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5), inset 0 0 60px rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            cursor: pointer;
            transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
            transition: transform 0.18s ease, box-shadow 0.3s ease;
            position: relative;
            user-select: none;
            padding: 24px;
        }

        .flash-card.pop {
            animation: cardPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardPop {
            0% { transform: perspective(900px) scale(0.82); opacity: 0.3; }
            60% { transform: perspective(900px) scale(1.06); }
            100% { transform: perspective(900px) scale(1); opacity: 1; }
        }

        .object-img {
            max-width: 62%;
            max-height: 40vh;
            object-fit: contain;
            filter: drop-shadow(0 16px 30px rgba(0, 0, 0, 0.5));
            animation: letterFloat 3.4s ease-in-out infinite;
        }

        @keyframes letterFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(-2deg); }
        }

        .syllable-word {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .syllable-chip {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.25);
            font-size: clamp(1.6rem, 6vw, 2.4rem);
            font-weight: 900;
            color: #fff;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
            animation: syllableIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            animation-delay: var(--delay, 0s);
        }

        @keyframes syllableIn {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        .card-badge {
            position: absolute;
            bottom: 20px;
            right: 22px;
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            color: rgba(255, 255, 255, 0.65);
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .nav-btn {
            width: 64px;
            height: 64px;
            border-radius: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #fff;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        .nav-btn:hover {
            transform: translateY(-4px) scale(1.06);
            border-color: var(--c-accent);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45), 0 0 26px rgba(34, 211, 238, 0.25);
        }

        .nav-btn:active {
            transform: scale(0.94);
        }

        .counter-chip {
            display: inline-block;
            min-width: 92px;
            text-align: center;
            padding: 10px 18px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--c-soft);
            font-weight: 700;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .dot-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 26px;
            flex-wrap: wrap;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.22);
            transition: all 0.3s ease;
        }

        .dot.active-dot {
            background: var(--c-accent);
            box-shadow: 0 0 12px rgba(34, 211, 238, 0.7);
            transform: scale(1.3);
        }

        .sound-btn {
            margin-top: 30px;
            padding: 14px 34px;
            border-radius: 40px;
            font-size: 1.05rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.05em;
            background: linear-gradient(135deg, var(--c-primary), var(--c-secondary), var(--c-accent));
            border: none;
            box-shadow: 0 14px 36px rgba(99, 102, 241, 0.45);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .sound-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 20px 48px rgba(99, 102, 241, 0.6);
        }

        .sound-btn:active {
            transform: scale(0.96);
        }

        @media (max-width: 576px) {
            .nav-btn {
                width: 54px;
                height: 54px;
                font-size: 1.35rem;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="container">
            <div class="row justify-content-center align-items-center mt-5">
                <div class="d-flex flex-wrap align-items-center justify-content-between w-100 mb-4">
                    <div class="gambar-wrapper" onclick="toggleMute()">
                        <img src="assets/icon/high-volume.png" alt="Volume" class="gambar-shadow" id="volumeImage">
                    </div>
                    <h1 class="mx-auto my-2 my-md-0">MENGENAL KATA</h1>
                    <a href="/belajar-membaca/dashboard.html" class="text-decoration-none ms-2">
                        <div class="gambar-wrapper">
                            <img src="assets/icon/home.png" alt="Beranda" class="gambar-shadow">
                        </div>
                    </a>
                </div>

                <div class="text-center mb-4">
                    <img src="assets/img/title-membaca.png" class="gambar-title" alt="Belajar Membaca">
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-12 d-flex justify-content-center">
                    <div class="flash-card" id="flashCard" onclick="playCurrent()">
                        <img src="assets/img/apel.png" class="object-img" id="objectImg" alt="Objek">
                        <div class="syllable-word" id="syllableWord">
                            <span class="syllable-chip" style="--delay:0s">A</span>
                            <span class="syllable-chip" style="--delay:.15s">PEL</span>
                        </div>
                        <span class="card-badge" id="cardBadge">1 / 8</span>
                    </div>
                </div>

                <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
                    <div class="nav-btn" onclick="changeIndex(-1)" title="Sebelumnya">
                        <i class="bi bi-arrow-left"></i>
                    </div>
                    <span class="counter-chip" id="counterChip">APEL</span>
                    <div class="nav-btn" onclick="changeIndex(1)" title="Berikutnya">
                        <i class="bi bi-arrow-right"></i>
                    </div>
                </div>

                <div class="col-12 text-center">
                    <button class="sound-btn" id="soundBtn" onclick="playCurrent()">
                        <i class="bi bi-volume-up-fill"></i> DENGARKAN
                    </button>
                </div>

                <div class="col-12 dot-indicator" id="dotIndicator"></div>
            </div>
        </div>
    </main>

    <audio id="audioPlayerbg" autoplay loop>
        <source src="assets/music/bg.wav" type="audio/mp3">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <script src="assets/tts.js"></script>
    <script src="assets/script.js"></script>
    <script src="assets/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const WORDS = [
            { img: 'assets/img/apel.png', word: 'APEL', syllables: ['A', 'PEL'] },
            { img: 'assets/img/bola.png', word: 'BOLA', syllables: ['BO', 'LA'] },
            { img: 'assets/img/kupu.png', word: 'KUPU-KUPU', syllables: ['KU', 'PU', 'KU', 'PU'] },
            { img: 'assets/img/ibu.png', word: 'IBU', syllables: ['I', 'BU'] },
            { img: 'assets/img/ayam.png', word: 'AYAM', syllables: ['A', 'YAM'] },
            { img: 'assets/img/roti.png', word: 'ROTI', syllables: ['RO', 'TI'] },
            { img: 'assets/img/topi.png', word: 'TOPI', syllables: ['TO', 'PI'] },
            { img: 'assets/img/buku.png', word: 'BUKU', syllables: ['BU', 'KU'] }
        ];

        let currentIndex = 0;
        const flashCard = document.getElementById('flashCard');
        const objectImg = document.getElementById('objectImg');
        const syllableWord = document.getElementById('syllableWord');
        const cardBadge = document.getElementById('cardBadge');
        const counterChip = document.getElementById('counterChip');
        const dotIndicator = document.getElementById('dotIndicator');

        function render() {
            const w = WORDS[currentIndex];
            objectImg.hidden = !w.img;
            if (w.img) objectImg.src = w.img;
            syllableWord.innerHTML = w.syllables
                .map((s, i) => `<span class="syllable-chip" style="--delay:${i * 0.15}s">${s}</span>`)
                .join('');
            cardBadge.textContent = `${currentIndex + 1} / ${WORDS.length}`;
            counterChip.textContent = w.word;
            document.querySelectorAll('.dot').forEach((d, i) => {
                d.classList.toggle('active-dot', i === currentIndex);
            });
            flashCard.classList.remove('pop');
            void flashCard.offsetWidth;
            flashCard.classList.add('pop');
            speak(w.word);
        }

        function changeIndex(direction) {
            currentIndex = (currentIndex + direction + WORDS.length) % WORDS.length;
            render();
        }

        function playCurrent() {
            speak(WORDS[currentIndex].word);
        }

        flashCard.addEventListener('mousemove', (e) => {
            const rect = flashCard.getBoundingClientRect();
            const px = (e.clientX - rect.left) / rect.width - 0.5;
            const py = (e.clientY - rect.top) / rect.height - 0.5;
            flashCard.style.setProperty('--ry', `${px * 18}deg`);
            flashCard.style.setProperty('--rx', `${-py * 18}deg`);
        });
        flashCard.addEventListener('mouseleave', () => {
            flashCard.style.setProperty('--rx', '0deg');
            flashCard.style.setProperty('--ry', '0deg');
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') changeIndex(1);
            if (e.key === 'ArrowLeft') changeIndex(-1);
        });

        WORDS.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.className = 'dot' + (i === 0 ? ' active-dot' : '');
            dot.onclick = () => { currentIndex = i; render(); };
            dotIndicator.appendChild(dot);
        });

        render();
    </script>
</body>

</html>
