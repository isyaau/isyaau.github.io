<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BELAJAR MEMBACA - Latihan</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="../assets/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/style.css" rel="stylesheet">

    <style>
        .quiz-img {
            width: min(300px, 70vw);
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 26px;
            border: 2px solid var(--card-border);
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.45);
            filter: drop-shadow(0 12px 26px rgba(0, 0, 0, 0.35));
            animation: quizFloat 3.6s ease-in-out infinite;
        }

        @keyframes quizFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-9px); }
        }

        .question-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--c-soft);
            font-weight: 700;
            letter-spacing: 0.06em;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            margin-bottom: 18px;
        }

        .option-btn {
            width: 100%;
            padding: 18px 24px;
            border-radius: 20px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            color: #fff;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.3);
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.02);
            border-color: var(--c-accent);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45), 0 0 26px rgba(34, 211, 238, 0.25);
        }

        .option-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .option-btn.correct {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.7), rgba(34, 197, 94, 0.6));
            border-color: #34d399;
            animation: correctPulse 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.45);
            border-color: #ef4444;
            animation: shakeX 0.45s ease;
        }

        .option-btn:disabled {
            opacity: 0.75;
            cursor: not-allowed;
        }

        @keyframes correctPulse {
            0% { transform: scale(0.85); }
            60% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        @keyframes shakeX {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-9px); }
            50% { transform: translateX(9px); }
            75% { transform: translateX(-5px); }
        }

        .score-chip {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 40px;
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.4);
            color: #fbbf24;
            font-weight: 800;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .progress-track {
            width: min(420px, 80vw);
            height: 12px;
            margin: 0 auto 18px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 40px;
            background: linear-gradient(90deg, var(--c-primary), var(--c-accent));
            transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .result-card {
            padding: 40px 32px;
            border-radius: 30px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            text-align: center;
        }

        .result-stars {
            font-size: 3.2rem;
            line-height: 1;
            margin-bottom: 8px;
            animation: starFloat 2.2s ease-in-out infinite;
        }

        @keyframes starFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.1); }
        }

        .confetti {
            position: fixed;
            top: -16px;
            width: 12px;
            height: 12px;
            z-index: 2000;
            pointer-events: none;
            border-radius: 2px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0.7;
            }
        }

        .sound-btn {
            padding: 14px 34px;
            border-radius: 40px;
            font-size: 1.05rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.05em;
            background: linear-gradient(135deg, var(--c-primary), var(--c-secondary), var(--c-accent));
            border: none;
            box-shadow: 0 14px 36px rgba(99, 102, 241, 0.45);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .sound-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 20px 48px rgba(99, 102, 241, 0.6);
        }

        .sound-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>

<body>
    <main>
        <div class="container">
            <div class="row justify-content-center align-items-center mt-5">
                <div class="d-flex flex-wrap align-items-center justify-content-between w-100 mb-4">
                    <div class="gambar-wrapper" onclick="toggleMute()">
                        <img src="assets/icon/high-volume.png" alt="Volume" class="gambar-shadow" id="volumeImage">
                    </div>
                    <h1 class="mx-auto my-2 my-md-0">LATIHAN</h1>
                    <a href="/dashboard.html" class="text-decoration-none ms-2">
                        <div class="gambar-wrapper">
                            <img src="assets/icon/home.png" alt="Beranda" class="gambar-shadow">
                        </div>
                    </a>
                </div>
            </div>

            <div class="row justify-content-center">
                <div class="col-12 text-center mb-3">
                    <span class="question-badge" id="questionBadge">Soal 1 dari 5</span>
                    <span class="score-chip ms-2" id="scoreChip"><i class="bi bi-star-fill me-1"></i>0</span>
                </div>

                <div class="col-12 text-center mb-3">
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>

                <div class="col-12 text-center">
                    <img src="" alt="Gambar soal" class="quiz-img" id="quizImg">
                </div>

                <div class="col-12 text-center mt-3">
                    <button class="sound-btn" onclick="playQuestion()">
                        <i class="bi bi-volume-up-fill"></i> DENGARKAN PERTANYAAN
                    </button>
                </div>

                <div class="col-11 col-md-8 col-lg-6 mt-4">
                    <div class="row g-3" id="optionsRow">
                        <!-- Opsi jawaban dibuat dinamis -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <audio id="audioPlayerbg" autoplay loop>
        <source src="assets/music/bg.wav" type="audio/mp3">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <script src="../assets/tts.js"></script>
    <script src="assets/script.js"></script>
    <script src="../assets/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const QUESTIONS = [
            { img: 'assets/img/apel.png', word: 'APEL', options: ['APEL', 'BOLA', 'KUPU'] },
            { img: 'assets/img/bola.png', word: 'BOLA', options: ['APEL', 'BOLA', 'KUPU'] },
            { img: 'assets/img/kupu.png', word: 'KUPU-KUPU', options: ['APEL', 'BOLA', 'KUPU-KUPU'] },
            { img: 'assets/img/apel.png', word: 'APEL', options: ['APEL', 'BOLA', 'KUPU-KUPU'] },
            { img: 'assets/img/bola.png', word: 'BOLA', options: ['APEL', 'BOLA', 'KUPU-KUPU'] }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const quizImg = document.getElementById('quizImg');
        const optionsRow = document.getElementById('optionsRow');
        const questionBadge = document.getElementById('questionBadge');
        const scoreChip = document.getElementById('scoreChip');
        const progressFill = document.getElementById('progressFill');

        function shuffleOpts(opts) {
            return [...opts].sort(() => Math.random() - 0.5);
        }

        function loadQuestion() {
            if (currentQuestion >= QUESTIONS.length) {
                showResult();
                return;
            }
            answered = false;
            const q = QUESTIONS[currentQuestion];
            quizImg.src = q.img;
            questionBadge.textContent = `Soal ${currentQuestion + 1} dari ${QUESTIONS.length}`;
            progressFill.style.width = `${(currentQuestion / QUESTIONS.length) * 100}%`;
            scoreChip.innerHTML = `<i class="bi bi-star-fill me-1"></i>${score}`;
            optionsRow.innerHTML = '';
            shuffleOpts(q.options).forEach(opt => {
                const col = document.createElement('div');
                col.className = 'col-12';
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(btn, opt, q.word);
                col.appendChild(btn);
                optionsRow.appendChild(col);
            });
        }

        function checkAnswer(btn, chosen, correct) {
            if (answered) return;
            answered = true;

            if (chosen === correct) {
                btn.classList.add('correct');
                score += 10;
                scoreChip.innerHTML = `<i class="bi bi-star-fill me-1"></i>${score}`;
                speak('Benar! ' + correct);
                burstConfetti();
            } else {
                btn.classList.add('wrong');
                document.querySelectorAll('.option-btn').forEach(b => {
                    if (b.textContent === correct) b.classList.add('correct');
                    b.disabled = true;
                });
                speak('Coba lagi. ' + correct);
            }

            setTimeout(() => {
                currentQuestion++;
                loadQuestion();
            }, 1800);
        }

        function playQuestion() {
            const q = QUESTIONS[currentQuestion];
            speak('Perhatikan gambar, lalu pilih kata yang tepat. ' + q.word);
        }

        function showResult() {
            progressFill.style.width = '100%';
            const stars = score >= 40 ? '⭐⭐⭐' : score >= 20 ? '⭐⭐' : '⭐';
            const msg = score >= 40 ? 'Luar biasa! Kamu hebat!' : score >= 20 ? 'Bagus! Terus berlatih ya!' : 'Jangan menyerah, coba lagi!';
            document.getElementById('questionBadge').style.display = 'none';
            optionsRow.innerHTML = `
                <div class="col-12">
                    <div class="result-card">
                        <div class="result-stars">${stars}</div>
                        <h2 class="fw-bold">${msg}</h2>
                        <p class="mb-4" style="font-size:1.15rem;"><i class="bi bi-star-fill me-2" style="color:#fbbf24;"></i>Skor: ${score}</p>
                        <button class="sound-btn" onclick="location.reload()"><i class="bi bi-arrow-repeat me-2"></i>ULANGI</button>
                    </div>
                </div>
            `;
            speak('Skor kamu ' + score);
        }

        function burstConfetti() {
            const colors = ['#6366f1', '#22d3ee', '#fbbf24', '#f472b6', '#34d399', '#a78bfa'];
            for (let i = 0; i < 45; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti';
                piece.style.left = Math.random() * 100 + 'vw';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDuration = (2 + Math.random() * 2) + 's';
                piece.style.animationDelay = (Math.random() * 0.6) + 's';
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 4500);
            }
        }

        loadQuestion();
    </script>
</body>

</html>
