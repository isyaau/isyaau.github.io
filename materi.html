<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BELAJAR MEMBACA - Materi</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="../assets/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/style.css" rel="stylesheet">
</head>

<body>
    <main>
        <div class="container">
            <div class="row justify-content-center align-items-center mt-5">
                <div class="d-flex flex-wrap align-items-center justify-content-between w-100 mb-4">
                    <div class="gambar-wrapper" onclick="toggleMute()" title="Suara">
                        <img src="assets/icon/high-volume.png" alt="Volume" class="gambar-shadow" id="volumeImage">
                    </div>
                    <h1 class="mx-auto my-2 my-md-0">Materi</h1>
                    <a href="/dashboard.html" class="text-decoration-none">
                        <div class="gambar-wrapper" title="Beranda">
                            <img src="assets/icon/home.png" alt="Beranda" class="gambar-shadow">
                        </div>
                    </a>
                </div>

                <div class="text-center mb-5">
                    <img src="assets/img/title-membaca.png" class="gambar-title" alt="Belajar Membaca">
                </div>
            </div>

            <!-- Cards Section -->
            <div class="row justify-content-center">
                <div class="col-6 col-md-4 col-lg-3 my-3 d-flex justify-content-center">
                    <a href="/materi-1.html" class="text-decoration-none d-block">
                        <div class="card h-100">
                            <img src="assets/img/img-materi.jpg" class="card-img-top" alt="Materi 1" style="object-fit: cover; height: 160px; width: 100%;">
                            <div class="card-body">
                                <p class="card-text">MATERI 1</p>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="col-6 col-md-4 col-lg-3 my-3 d-flex justify-content-center">
                    <div class="card h-100 text-center" style="opacity:1;">
                        <img src="assets/img/img-quiz.jpg" class="card-img-top" alt="Materi 2" style="object-fit: cover; height: 160px; width: 100%;">
                        <div class="card-body">
                            <p class="card-text">MATERI 2 <span class="badge text-bg-warning ms-1" style="font-size:.65rem;">Segera</span></p>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-4 col-lg-3 my-3 d-flex justify-content-center">
                    <div class="card h-100 text-center" style="opacity:1;">
                        <img src="assets/img/img-about.jpg" class="card-img-top" alt="Materi 3" style="object-fit: cover; height: 160px; width: 100%;">
                        <div class="card-body">
                            <p class="card-text">MATERI 3 <span class="badge text-bg-warning ms-1" style="font-size:.65rem;">Segera</span></p>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-4 col-lg-3 my-3 d-flex justify-content-center">
                    <div class="card h-100 text-center" style="opacity:1;" onclick="logout()" role="button">
                        <img src="assets/img/img-logout.jpg" class="card-img-top" alt="Materi 4" style="object-fit: cover; height: 160px; width: 100%;">
                        <div class="card-body">
                            <p class="card-text">MATERI 4 <span class="badge text-bg-warning ms-1" style="font-size:.65rem;">Segera</span></p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <audio id="audioPlayerbg" autoplay loop>
        <source src="assets/music/bg.wav" type="audio/mp3">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <script src="assets/script.js"></script>
    <script src="../assets/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
